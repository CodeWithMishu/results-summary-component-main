<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Results summary component</title>

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <section id="dash">
      <div id="result">
        <h2>Your Result</h2>
        <div id="status">
          <p><span>76</span> of 100</p>
        </div>
        <p>Great</p>
        <p>
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </div>
      <div id="summary">
        <h2>Summary</h2>
        <div class="S-cards">
          <div id="S1" class="S">
            <div class="idiv">
              <img src="assets/images/icon-reaction.svg" alt="icon-reaction" />
              <span>Reaction</span>
            </div>
            <div class="points">
              <span>80</span>
              /100
            </div>
          </div>
          <div id="S2" class="S">
            <div class="idiv">
              <img src="assets/images/icon-memory.svg" alt="icon-memory" />
              <span>Memory</span>
            </div>
            <div class="points"><span>92</span>/100</div>
          </div>
          <div id="S3" class="S">
            <div class="idiv">
              <img src="assets/images/icon-verbal.svg" alt="icon-verbal" />
              <span>Verbal</span>
            </div>
            <div class="points"><span>61</span>/100</div>
          </div>
          <div id="S4" class="S">
            <div class="idiv">
              <img src="assets/images/icon-visual.svg" alt="" />
              <span>Visual</span>
            </div>
            <div class="points"><span>73</span>/100</div>
          </div>
        </div>
        <button id="continue">Continue</button>
      </div>
    </section>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://codewithmishu.in/">CodeWithMishu</a>.
    </footer>
  </body>
</html>
