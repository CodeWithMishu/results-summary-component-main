<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Results summary component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
      @import url("https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");
      body {
        font-family: "Hanken Grotesk", sans-serif;
        background-color: hsl(221, 100%, 96%);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      #dash {
        flex: 0 0 auto;
        display: grid;
        place-content: center;
        background-color: hsl(0, 0%, 100%);
        height: auto;
        border-radius: 30px;
        padding: 20px;
        
        #result {
          border-radius: 30px;
          grid-area: result;
          background-color: hsl(252, 100%, 67%);
          padding: 20px;
        }
        #summary {
          grid-area: summary;
        }
        grid-template-columns: 40% 40%;
        grid-template-areas: "result summary";
        justify-content: space-between;
      }

      footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <section id="dash">
      <div id="result">
        <h2>Your Result</h2>
        <div id="status">76 of 100</div>
        <p>Great</p>
        <p>
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </div>
      <div id="summary">
        <h2>Summary</h2>
        <div id="S1">
          <img src="" alt="" />
          <span>Reaction</span>
          <span>80/100</span>
        </div>
        <div id="S2">
          <img src="" alt="" />
          <span>Memory</span>
          <span>92/100</span>
        </div>
        <div id="S3">
          <img src="" alt="" />
          <span>Verbal</span>
          <span>61/100</span>
        </div>
        <div id="S4">
          <img src="" alt="" />
          <span>Visual</span>
          <span>73/100</span>
        </div>
        <button id="continue">Continue</button>
      </div>
    </section>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://codewithmishu.in/">CodeWithMishu</a>.
    </footer>
  </body>
</html>
